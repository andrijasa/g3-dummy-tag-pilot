name: Dummy tag permission pilot D6
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Enter D6-DUMMY after activating the isolated tag ruleset
        required: true
        type: string
permissions: {}
jobs:
  review:
    if: github.repository == 'andrijasa/g3-dummy-tag-pilot' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirm == 'D6-DUMMY'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Check create, update and delete permissions on one dummy tag
        env:
          LEDGER_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          BASE = "https://api.github.com/repos/andrijasa/g3-dummy-tag-pilot"
          PREFIX = "refs/tags/g3-d6-dummy/*"

          def request(method, path, data=None):
              headers = {"Authorization": "Bearer " + os.environ["LEDGER_TOKEN"],
                         "Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28",
                         "Content-Type": "application/json"}
              body = None if data is None else json.dumps(data).encode()
              req = Request(BASE + path, data=body, headers=headers, method=method)
              try:
                  with urlopen(req, timeout=10) as response:
                      status = response.status
                      raw = response.read()
              except HTTPError as error:
                  with error:
                      status, raw = error.code, error.read()
              return status, json.loads(raw) if raw else {}

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          status, rulesets = request("GET", "/rulesets")
          require(status == 200 and isinstance(rulesets, list), "HOLD: rulesets inaccessible")
          named = [rule for rule in rulesets if rule.get("name") == "g3-d6-dummy-tags"]
          require(len(named) == 1, "HOLD: D6 ruleset missing or ambiguous")
          status, rule = request("GET", f"/rulesets/{int(named[0]['id'])}")
          require(status == 200 and rule.get("target") == "tag"
                  and rule.get("enforcement") == "active", "HOLD: D6 tag ruleset inactive")
          ref_filter = rule.get("conditions", {}).get("ref_name", {})
          require(ref_filter == {"include": [PREFIX], "exclude": []},
                  "HOLD: D6 ruleset scope differs")
          kinds = {item["type"] for item in rule.get("rules", [])}
          require({"update", "deletion"} <= kinds and "creation" not in kinds,
                  "HOLD: D6 ruleset must allow create and restrict update/delete")

          run = os.environ["GITHUB_RUN_ID"]
          initial = os.environ["GITHUB_SHA"]
          require(re.fullmatch(r"[0-9]+", run) and re.fullmatch(r"[a-f0-9]{40}", initial),
                  "HOLD: invalid run provenance")
          status, commit = request("GET", f"/commits/{initial}")
          parents = commit.get("parents", [])
          require(status == 200 and len(parents) == 1, "HOLD: one parent commit required")
          alternate = parents[0]["sha"]
          require(re.fullmatch(r"[a-f0-9]{40}", alternate) and alternate != initial,
                  "HOLD: invalid alternate commit")
          tag = f"g3-d6-dummy/run-{run}"
          status, result = request("POST", "/git/refs", {"ref": f"refs/tags/{tag}", "sha": initial})
          require(status == 201 and result.get("object", {}).get("sha") == initial,
                  "HOLD: control create not confirmed")
          for method, payload in (("PATCH", {"sha": alternate, "force": True}), ("DELETE", None)):
              status, result = request(method, f"/git/refs/tags/{tag}", payload)
              require(not 200 <= status < 300, f"FAIL: {method} allowed")
              message = str(result.get("message", ""))
              details = json.dumps(result.get("errors", []), sort_keys=True)
              diagnostic = f"{message} {details}"
              normalized = diagnostic.lower()
              if status not in (403, 422) or not (
                  "gh013" in normalized or
                  ("repository rule violations found" in normalized and
                   (("update" if method == "PATCH" else "delet") in normalized))
              ):
                  # The API call only targets a public synthetic ref. Log safe classification flags.
                  print(f"Unexpected denial for {method}: HTTP {status}; "
                        f"repository_rule_phrase={'repository rule violations found' in normalized}; "
                        f"update_phrase={'update' in normalized}; deletion_phrase={'delet' in normalized}")
                  raise SystemExit(f"HOLD: {method} lacks explicit ruleset rejection")
              status, current = request("GET", f"/git/ref/tags/{tag}")
              require(status == 200 and current.get("object", {}).get("sha") == initial,
                      f"FAIL: ref differs after {method}")
              print(f"{method}: rejected by ruleset, original SHA verified")
          print("D6 PASS: create allowed, rule denies update/delete, original SHA verified")
          PY
